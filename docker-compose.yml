version: '3.8'

services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: attendance_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"

  # 2. Node.js Express Backend API
  backend:
    build: ./backend
    container_name: backend_api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: attendance_db
      PORT: 5000
    depends_on:
      - db

  # 3. React Vite Frontend UI
  frontend:
    build: ./frontend
    container_name: frontend_ui
    ports:
      - "80:80"
    depends_on:
      - backend